<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="preload" href="/fonts/Roboto-Regular.ttf" as="font" type="font/ttf" crossorigin />
        <link rel="preload" href="/fonts/Roboto-Bold.ttf" as="font" type="font/ttf" crossorigin />
        <link rel="icon" href="%sveltekit.assets%/favicon.png" />
        <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
        <link rel="apple-touch-icon" href="%sveltekit.assets%/images/apple-touch-icon.png" />
        <meta name="theme-color" content="#1b1e2b" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black" />
        <meta name="apple-mobile-web-app-title" content="Gains Galaxy" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
